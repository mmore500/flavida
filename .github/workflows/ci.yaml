name: Continuous Integration

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make python2
      - name: Build Avida
        run: ./build_avida
      # The fork's test runner is Python 2, and several consistency tests
      # currently fail because of behavioral changes in this fork,
      # so test results are reported without blocking the image build.
      - name: Run tests
        continue-on-error: true
        run: python2 avida-core/tests/_testrunner/testrunner.py ---testrunner-name=./run_tests

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-22.04
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
